<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIRA ❤️‍🩹</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#e5ddd5;
}

/* FULL SCREEN MOBILE */
#app{
  max-width:480px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#e5ddd5;
}

/* HEADER */
#header{
  background:#075e54;
  color:white;
  padding:14px;
  display:flex;
  align-items:center;
  gap:10px;
}

#avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  color:#075e54;
}

/* CHAT AREA */
#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

/* MESSAGE BUBBLES */
.msg{
  max-width:75%;
  padding:8px 12px;
  border-radius:10px;
  margin:6px 0;
  font-size:14px;
  line-height:1.4;
  word-wrap:break-word;
}

.user{
  background:#dcf8c6;
  margin-left:auto;
}

.bot{
  background:white;
}

.typing{
  font-style:italic;
  opacity:0.6;
}

/* INPUT BAR */
#inputBar{
  display:flex;
  padding:8px;
  background:#f0f0f0;
  align-items:center;
}

#text{
  flex:1;
  padding:10px;
  border:none;
  border-radius:20px;
  outline:none;
  background:white;
}

#send{
  margin-left:8px;
  background:#075e54;
  color:white;
  border:none;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:16px;
}
</style>
</head>

<body>

<div id="app">

  <div id="header">
    <div id="avatar">N</div>
    <div>
      <div><b>NIRA ❤️‍🩹</b></div>
      <small>Online</small>
    </div>
  </div>

  <div id="chat">
    <div class="msg bot">
      Hey… how are you? 🤍
    </div>
  </div>

  <div id="inputBar">
    <input id="text" placeholder="Type a message…" />
    <button id="send" onclick="send()">➤</button>
  </div>

</div>

<script>
function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.textContent=text;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop=9999;
  return d;
}

async function send(){
  const input=document.getElementById("text");
  const msg=input.value.trim();
  if(!msg) return;

  add(msg,"user");
  input.value="";

  const typing=add("NIRA is typing…","bot typing");

  try{
    const res=await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:msg})
    });

    const data=await res.json();
    typing.remove();
    add(data.reply,"bot");

  }catch{
    typing.remove();
    add("I’m here… something went wrong 🤍","bot");
  }
}

/* ENTER KEY SUPPORT */
document.getElementById("text").addEventListener("keypress",function(e){
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
