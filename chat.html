<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIRA ❤️‍🩹</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#e5ddd5;
}

#app{
  max-width:480px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#e5ddd5;
}

#header{
  background:#075e54;
  color:white;
  padding:14px;
  font-weight:bold;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  max-width:75%;
  padding:10px 12px;
  border-radius:12px;
  margin:6px 0;
  font-size:14px;
  line-height:1.4;
}

.user{
  background:#dcf8c6;
  margin-left:auto;
}

.bot{
  background:white;
}

#inputBar{
  display:flex;
  padding:8px;
  background:#f0f0f0;
}

#text{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  outline:none;
}

#send{
  margin-left:8px;
  border:none;
  background:#075e54;
  color:white;
  border-radius:50%;
  width:42px;
  height:42px;
}
</style>
</head>

<body>

<div id="app">

<div id="header">NIRA ❤️‍🩹</div>

<div id="chat">
  <div class="msg bot">Hey… how are you feeling today da?</div>
</div>

<div id="inputBar">
  <input id="text" placeholder="Type your feelings..." />
  <button id="send" onclick="send()">➤</button>
</div>

</div>

<script>

speechSynthesis.onvoiceschanged = () => {};

function speak(text){

  const voices = speechSynthesis.getVoices();

  let femaleVoice = voices.find(v =>
    v.name.toLowerCase().includes("female") ||
    v.name.toLowerCase().includes("zira") ||
    v.name.toLowerCase().includes("samantha")
  );

  const msg = new SpeechSynthesisUtterance(text);

  if(femaleVoice){
    msg.voice = femaleVoice;
  }

  // default voice
  msg.rate = 0.9;
  msg.pitch = 1.1;
  msg.volume = 1;

  const hour = new Date().getHours();

  // 🌙 NIGHT WHISPER
  if(hour >= 22 || hour <= 5){
    msg.rate = 0.6;
    msg.pitch = 0.75;
    msg.volume = 0.6;
  }

  // ❤️ EMOTIONAL WHISPER
  const emotionalWords = [
    "sad","tired","alone","hurt","cry",
    "lonely","stress","depressed",
    "kashtam","sorndhu","azhudhu"
  ];

  const lower = text.toLowerCase();

  if(emotionalWords.some(w => lower.includes(w))){
    msg.rate = 0.55;
    msg.pitch = 0.7;
    msg.volume = 0.5;
  }

  speechSynthesis.cancel();
  speechSynthesis.speak(msg);
}

function add(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop = 9999;
}

async function send(){
  const input = document.getElementById("text");
  const msg = input.value.trim();

  if(!msg) return;

  add(msg, "user");
  input.value = "";

  try{
    const res = await fetch("/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:msg})
    });

    const data = await res.json();

    add(data.reply, "bot");

    // human-like delay before speaking
    setTimeout(() => {
      speak(data.reply);
    }, 300);

  }catch{
    add("Something went wrong da… but I’m still here 🤍", "bot");
  }
}

document.getElementById("text").addEventListener("keypress", e => {
  if(e.key === "Enter") send();
});

</script>

</body>
</html>
